services:
  postgres:
    image: postgres:16-alpine
    container_name: storemesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storemesh
      POSTGRES_USER: storemesh
      POSTGRES_PASSWORD: storemesh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storemesh -d storemesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
